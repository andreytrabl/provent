<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Иконка сайта ПроВент: тёмный фон, белая буква "П" + голубая русская "В"
       (акцентный цвет сайта, тот же #2f97f0, что и в кнопках "Позвонить"). Шрифт —
       обычный системный жирный (Arial/Helvetica), т.к. favicon такой маленький,
       что фирменный Mulish на нём всё равно не будет заметен, а системный шрифт
       гарантированно отрисуется в любом браузере без подгрузки внешних файлов. -->
  <rect fill="#111111" width="100" height="100" rx="20"/>
  <text y="68" x="50" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="44" letter-spacing="-1"><tspan fill="#ffffff">П</tspan><tspan fill="#2f97f0">В</tspan></text>
</svg>
